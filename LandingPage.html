<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BingeBerry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Dangrek&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="nav-bar">

        <div class="logo">
            BingeBerry
        </div>

        <div class="buttons">
            <button class="sign-up">
                Sign up
            </button>
            <button class="log-in">
                Log in
            </button>
        </div>
    </div>

    <div class="hero">
        <h1 class="hero-label">Minecraft: The Movie</h1>
        <img class="hero-poster" src="Images\Minecraft.jpg">
    </div>

    <div class="featured-section">
        <h1 class="featured-header">Featured</h1>

        <div class="featured-movies">
            <div id="mov1" class="mov">
                <img id="mov-poster-1" class="poster" src="Images\Paddington.jpg">
                <p id="mov-label-1" class="mov-label">Paddinton in Peru</p>
            </div>

            <div id="mov2" class="mov">
                <img id="mov-poster-2" class="poster" src="Images\Ne Zha.jpg">
                <p id="mov-label-2" class="mov-label">Ne Zha 2</p>
            </div>

            <div id="mov3" class="mov">
                <img id="mov-poster-3" class="poster" src="Images\Happy Death Day.jpg">
                <p id="mov-label-3" class="mov-label">Happy Death Day 2U</p>
            </div>

            <div id="mov4" class="mov">
                <img id="mov-poster-4" class="poster" src="Images\Barbie.jpg">
                <p id="mov-label-4" class="mov-label">Barbie</p>
            </div>

            <div id="mov5" class="mov">
                <img id="mov-poster-5" class="poster" src="Images\Oppenheimer.jpg">
                <p id="mov-label-5" class="mov-label">Oppenheimer</p>
            </div>

            <div id="mov6" class="mov">
                <img id="mov-poster-6" class="poster" src="Images\Titanic.jpg">
                <p id="mov-label-6" class="mov-label">Titanic</p>
            </div>
        </div>
    </div>

    <hr>

    <div class="footer">
        <div class="footer-links">
            <a id="github" href="https://github.com/bakedapple1/Assignment-2" target="_blank">GitHub</a>
            <a id="license"
                href="https://preview.redd.it/what-are-some-funny-license-plates-youve-seen-in-ottawa-v0-w3pu1v029tub1.jpg?width=640&crop=smart&auto=webp&s=2fa076cb07306240e492631ca6178d3e9bcce591"
                target="_blank">Licence</a>
            <a id="privacy" href="https://youtu.be/dQw4w9WgXcQ" target="_blank">Privacy Policy</a>
        </div>

        <div class="footer-text">
            <p id="credit">Web Design: Daniel C</p>
            <p id="copyright">© BingBerry 2025</p>
        </div>
    </div>
</body>

</html>
